<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen">



  <!-- Auth Page-->
  <div id="auth-page" class="page-auth hidden">
    <div class="auth-card">

      <div class="text-center mb-8">
        <h1 class="app-title text-4xl font-black">Task<span></span></h1>
        <p class="text-slate-500 text-sm mt-1 tracking-widest uppercase">Manage Your Tasks.</p>
      </div>

      <!--tabs-->
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Sign In</button>
        <button class="auth-tab" data-tab="register">Sign Up</button>
      </div>

      <!-- login form -->
      <form id="login-form" class="auth-form">
        <div class="field-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="field-group">
          <label>Password</label>
          <div class="relative">
            <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" />
            <button type="button" class="pwd-toggle" data-target="login-password">👁</button>
          </div>
        </div>
        <div id="login-error" class="auth-error hidden"></div>
        <button type="submit" class="auth-submit" id="login-btn">
          <span class="btn-text">Sign In</span>
          <span class="btn-spinner hidden">⟳</span>
        </button>
      </form>

      <!-- register Form -->
      <form id="register-form" class="auth-form hidden">
        <div class="field-group">
          <label>Username</label>
          <input type="text" id="reg-username" placeholder="johndoe" autocomplete="username" />
        </div>
        <div class="field-group">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="field-group">
          <label>Password <span class="text-slate-500 text-xs">(min 6 chars)</span></label>
          <div class="relative">
            <input type="password" id="reg-password" placeholder="••••••••" autocomplete="new-password" />
            <button type="button" class="pwd-toggle" data-target="reg-password">👁</button>
          </div>
        </div>
        <div id="register-error" class="auth-error hidden"></div>
        <button type="submit" class="auth-submit" id="register-btn">
          <span class="btn-text">Create Account</span>
          <span class="btn-spinner hidden">⟳</span>
        </button>
      </form>

    </div>
  </div>

  <!--main page -->
  <div id="app-page" class="hidden min-h-screen flex items-start justify-center pt-12 px-4 pb-12">
    <div class="w-full max-w-2xl">

      <div class="flex items-center justify-between mb-8">
        <div>
          <h1 class="app-title text-3xl font-black">Task<span>Manager</span></h1>
          <p id="welcome-msg" class="text-slate-500 text-xs mt-0.5"></p>
        </div>
        <button id="logout-btn" class="logout-btn" title="Logout">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1"/>
          </svg>
          Logout
        </button>
      </div>

      <!-- stats -->
      <div class="flex gap-3 mb-6">
        <div class="stat-card flex-1 text-center">
          <div id="stat-total" class="stat-number text-2xl font-bold text-white">0</div>
          <div class="text-xs text-slate-500 mt-1">Total</div>
        </div>
        <div class="stat-card flex-1 text-center">
          <div id="stat-done" class="stat-number text-2xl font-bold text-purple-400">0</div>
          <div class="text-xs text-slate-500 mt-1">Done</div>
        </div>
        <div class="stat-card flex-1 text-center">
          <div id="stat-pending" class="stat-number text-2xl font-bold text-amber-400">0</div>
          <div class="text-xs text-slate-500 mt-1">Pending</div>
        </div>
      </div>

      <!-- progress bar -->
      <div class="progress-bar-wrap mb-6">
        <div class="progress-bar-fill" style="width:0%"></div>
      </div>

      <!-- add tasks -->
      <form id="task-form" class="mb-4">
        <div class="flex gap-2 mb-2">
          <input id="task-input" type="text" placeholder="What needs to be done?" class="task-input flex-1" autocomplete="off" maxlength="200" />
          <button type="submit" class="add-btn" id="add-btn">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
            </svg>
            Add
          </button>
        </div>
        <div class="flex gap-2 items-center">
          <label class="text-xs text-slate-500 whitespace-nowrap">Due date:</label>
          <input id="due-date-input" type="date" class="due-input" />
          <button type="button" id="clear-due" class="text-xs text-slate-600 hover:text-slate-400 transition-colors">✕ Clear</button>
        </div>
      </form>

      <!-- search and filter -->
      <div class="flex gap-2 mb-4">
        <div class="relative flex-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z"/>
          </svg>
          <input id="search-input" type="text" placeholder="Search tasks..." class="search-input w-full pl-9" />
        </div>
        <div class="flex gap-1 bg-slate-800/60 p-1 rounded-xl">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="pending">Pending</button>
          <button class="filter-btn" data-filter="completed">Done</button>
        </div>
      </div>


      <div id="toast" class="toast hidden"></div>

      <!-- task list -->
      <div id="task-list" class="space-y-2">
        <div id="loading" class="space-y-2">
          <div class="skeleton h-16 rounded-xl"></div>
          <div class="skeleton h-16 rounded-xl"></div>
          <div class="skeleton h-16 rounded-xl"></div>
        </div>
      </div>

      <!-- empty state -->
      <div id="empty-state" class="hidden text-center py-16">
        <div class="text-5xl mb-4"><span class="empty-icon">✨</span></div>
        <p class="text-slate-400 font-medium">No tasks found</p>
        <p class="text-slate-600 text-sm mt-1">Add one above to get started</p>
      </div>

      <!-- pagination -->
      <div id="pagination" class="hidden flex justify-center gap-2 mt-6"></div>

      <!-- admin panel for admin user
      -->
      <div id="admin-panel" class="hidden mt-10">
        <div class="flex items-center gap-2 mb-4">
          <span class="admin-badge">ADMIN</span>
          <h2 class="text-slate-300 font-semibold text-sm">Admin Panel</h2>
        </div>
        <div class="grid grid-cols-2 gap-3 mb-4" id="admin-stats"></div>
        <div class="admin-card">
          <div class="flex items-center justify-between mb-3">
            <span class="text-slate-300 text-sm font-semibold">All Users</span>
            <button id="refresh-users" class="text-xs text-slate-500 hover:text-orange-400 transition-colors">↻ Refresh</button>
          </div>
          <div id="users-table"></div>
        </div>
      </div>

    </div>
  </div>

  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
